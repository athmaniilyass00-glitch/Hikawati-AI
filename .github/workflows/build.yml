name: Build Hikawati AI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Files and Build
      run: |
        mkdir -p app/src/main/java/com/hikawati/ai
        
        echo '<?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Hikawati AI" android:theme="@android:style/Theme.DeviceDefault">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>' > app/src/main/AndroidManifest.xml

        echo 'plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }
        android {
            namespace = "com.hikawati.ai"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.hikawati.ai"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "1.0"
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = "1.5.1" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation(platform("androidx.compose:compose-bom:2023.08.00"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.material3:material3")
        }' > app/build.gradle.kts

        echo 'package com.hikawati.ai
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.material3.*
        import androidx.compose.runtime.Composable

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent { MaterialTheme { Text("مرحباً بك في حكاواتي AI 🚀") } }
            }
        }' > app/src/main/java/com/hikawati/ai/MainActivity.kt

        echo 'plugins {
            id("com.android.application") version "8.2.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.20" apply false
        }' > build.gradle.kts

        echo 'pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Hikawati AI"
        include(":app")' > settings.gradle.kts

        echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        kotlin.code.style=official' > gradle.properties

    - name: Build APK
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.2'
        arguments: :app:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hikawati-APK
        path: app/build/outputs/apk/debug/*.apk
